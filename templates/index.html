<!DOCTYPE html>
<html lang="en-CA">
    <head>
        <title>error 404</title>

        <style>
            .error {
                position: absolute;
                top: 35%;
                left: 50%;
                transform: translate(-50%, -50%);

                h1 {
                    color: oklch(0.7176 0.1839 304.77);
                    font-size: 128px;
                    margin-bottom: 0;
                    max-width: fit-content;
                    margin-left: auto;
                    margin-right: auto;
                    text-align: center;
                }

                p {
                    margin-top: 0;
                    max-width: fit-content;
                    margin-left: auto;
                    margin-right: auto;
                    text-align: center;
                }
            }

            body {
                background: #1e1e2e;
            }

            ::selection {
            background: oklch(0.483 0.137 319.619);
            }

            .space-grotesk-single-header {
                font-family: "Space Grotesk", sans-serif;
                font-optical-sizing: auto;
                font-weight: 425;
                font-style: normal;
                color: oklch(0.751 0.0396 273.93);
            }

            .space-grotesk-normal{
                font-family: "Space Grotesk", sans-serif;
                font-optical-sizing: auto;
                font-weight: 350;
                font-style: normal;
                color: oklch(0.751 0.0396 273.93);
            }
        </style>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="error space-grotesk-normal">
            <h1 class="space-grotesk-single-header">404</h1>
            <p>there is no router associated with this domain</p>
        </div>
    </body>
</html>
